name: Email Cherish on feat/fix push

on:
  push:
    branches: [main]

# One-off manual trigger, useful for testing after adding the SMTP secrets
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build email body from push event
        id: build
        env:
          OUT_HTML: /tmp/feature-email.html
          OUT_META: /tmp/feature-email.meta.json
        run: |
          node .github/scripts/build-feature-email.mjs
          send=$(jq -r '.send' /tmp/feature-email.meta.json 2>/dev/null || echo false)
          echo "send=$send" >> "$GITHUB_OUTPUT"
          if [ "$send" = "true" ]; then
            subject=$(jq -r '.subject' /tmp/feature-email.meta.json)
            echo "subject<<EOF" >> "$GITHUB_OUTPUT"
            echo "$subject" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            jq -r '.plainBody' /tmp/feature-email.meta.json > /tmp/feature-email.txt
          fi

      - name: Send feature summary email
        if: steps.build.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: ${{ secrets.SMTP_SECURE }}   # 'true' for port 465, 'false' for 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ${{ steps.build.outputs.subject }}
          from: "Peachy Pals Dev Updates <${{ secrets.SMTP_FROM }}>"
          to: ${{ vars.NOTIFY_TO || 'info@kdconcierge.com' }}
          reply_to: ${{ vars.NOTIFY_REPLY_TO || secrets.SMTP_FROM }}
          html_body: file:///tmp/feature-email.html
          body: file:///tmp/feature-email.txt
          ignore_cert: false
          convert_markdown: false
          priority: normal
